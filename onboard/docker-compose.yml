services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: onboard
      POSTGRES_PASSWORD: onboard
      POSTGRES_DB: onboard
    ports:
      - "55432:5432"
    volumes:
      - onboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboard -d onboard"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  onboard-pgdata:
